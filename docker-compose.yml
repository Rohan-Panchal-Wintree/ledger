services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8990:8989"
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_LOCAL_URL: http://localhost:8990
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
